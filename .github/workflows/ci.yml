name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  dependencies-and-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, worker]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Neither package currently commits a lockfile, so npm ci and
      # setup-node's lockfile-based cache cannot be used yet.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n 1 node --check

      # These are dependency/syntax checks, not application integration tests.
